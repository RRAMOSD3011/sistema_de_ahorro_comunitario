                        className="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-100 font-bold text-sm"
                        title="Negrita"
                      >
                        B
                      </button>
                      
                      <button
                        type="button"
                        onClick={() => {
                          const textarea = document.getElementById('estatutos-textarea');
                          const start = textarea.selectionStart;
                          const end = textarea.selectionEnd;
                          const selectedText = editando.contenido.substring(start, end);
                          const newText = editando.contenido.substring(0, start) + '_' + selectedText + '_' + editando.contenido.substring(end);
                          setEditando({...editando, contenido: newText});
                        }}
                        className="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-100 italic text-sm"
                        title="Cursiva"
                      >
                        I
                      </button>
                      
                      <button
                        type="button"
                        onClick={() => {
                          const textarea = document.getElementById('estatutos-textarea');
                          const start = textarea.selectionStart;
                          const end = textarea.selectionEnd;
                          const selectedText = editando.contenido.substring(start, end);
                          const newText = editando.contenido.substring(0, start) + '~~' + selectedText + '~~' + editando.contenido.substring(end);
                          setEditando({...editando, contenido: newText});
                        }}
                        className="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-100 text-sm line-through"
                        title="Tachado"
                      >
                        S
                      </button>
                    </div>
                    
                    {/* Segunda fila: Títulos y formato */}
                    <div className="flex flex-wrap gap-2 p-3 border-b border-gray-200">
                      <select
                        onChange={(e) => {
                          const textarea = document.getElementById('estatutos-textarea');
                          const start = textarea.selectionStart;
                          const end = textarea.selectionEnd;
                          const selectedText = editando.contenido.substring(start, end);
                          let newText = '';
                          
                          switch(e.target.value) {
                            case 'h1':
                              newText = editando.contenido.substring(0, start) + '# ' + selectedText + editando.contenido.substring(end);
                              break;
                            case 'h2':
                              newText = editando.contenido.substring(0, start) + '## ' + selectedText + editando.contenido.substring(end);
                              break;
                            case 'h3':
                              newText = editando.contenido.substring(0, start) + '### ' + selectedText + editando.contenido.substring(end);
                              break;
                            default:
                              newText = editando.contenido;
                          }
                          setEditando({...editando, contenido: newText});
                          e.target.value = '';
                        }}
                        className="px-3 py-1 border border-gray-300 rounded text-sm"
                      >
                        <option value="">Estilos de Título</option>
                        <option value="h1">Título 1 (Grande)</option>
                        <option value="h2">Título 2 (Mediano)</option>
                        <option value="h3">Título 3 (Pequeño)</option>
                      </select>
                      
                      <div className="border-l border-gray-300 mx-1"></div>
                      
                      <button
                        type="button"
                        onClick={() => {
                          const textarea = document.getElementById('estatutos-textarea');
                          const start = textarea.selectionStart;
                          const newText = editando.contenido.substring(0, start) + '\n- ' + editando.contenido.substring(start);
                          setEditando({...editando, contenido: newText});
                        }}
                        className="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-100 text-sm"
                        title="Lista con viñetas"
                      >
                        • Lista
                      </button>
                      
                      <button
                        type="button"
                        onClick={() => {
                          const textarea = document.getElementById('estatutos-textarea');
                          const start = textarea.selectionStart;
                          const lines = editando.contenido.substring(0, start).split('\n');
                          const currentLineNum = lines.length;
                          const newText = editando.contenido.substring(0, start) + '\n' + currentLineNum + '. ' + editando.contenido.substring(start);
                          setEditando({...editando, contenido: newText});
                        }}
                        className="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-100 text-sm"
                        title="Lista numerada"
                      >
                        1. Numerada
                      </button>
                      
                      <button
                        type="button"
                        onClick={() => {
                          const textarea = document.getElementById('estatutos-textarea');
                          const start = textarea.selectionStart;
                          const lineStart = editando.contenido.lastIndexOf('\n', start - 1) + 1;
                          const newText = editando.contenido.substring(0, lineStart) + '    ' + editando.contenido.substring(lineStart);
                          setEditando({...editando, contenido: newText});
                        }}
                        className="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-100 text-sm"
                        title="Aumentar sangría"
                      >
                        → Sangría
                      </button>
                      
                      <button
                        type="button"
                        onClick={() => {
                          const textarea = document.getElementById('estatutos-textarea');
                          const start = textarea.selectionStart;
                          const lineStart = editando.contenido.lastIndexOf('\n', start - 1) + 1;
                          const lineText = editando.contenido.substring(lineStart);
                          if (lineText.startsWith('    ')) {
                            const newText = editando.contenido.substring(0, lineStart) + editando.contenido.substring(lineStart + 4);
                            setEditando({...editando, contenido: newText});
                          }
                        }}
                        className="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-100 text-sm"
                        title="Reducir sangría"
                      >
                        ← Quitar
                      </button>
                    </div>
                    
                    {/* Tercera fila: Alineación */}
                    <div className="flex flex-wrap gap-2 p-3">
                      <span className="text-xs text-gray-600 self-center mr-2">Alineación:</span>
                      
                      <button
                        type="button"
                        onClick={() => {
                          const textarea = document.getElementById('estatutos-textarea');
                          const start = textarea.selectionStart;
                          const end = textarea.selectionEnd;
                          const selectedText = editando.contenido.substring(start, end);
                          const newText = editando.contenido.substring(0, start) + '<div style="text-align:left">' + selectedText + '</div>' + editando.contenido.substring(end);
                          setEditando({...editando, contenido: newText});
                        }}
                        className="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-100 text-sm"
                        title="Alinear a la izquierda"
                      >
                        ⬅️ Izquierda
                      </button>
                      
                      <button
                        type="button"
                        onClick={() => {
                          const textarea = document.getElementById('estatutos-textarea');
                          const start = textarea.selectionStart;
                          const end = textarea.selectionEnd;
                          const selectedText = editando.contenido.substring(start, end);
                          const newText = editando.contenido.substring(0, start) + '<div style="text-align:center">' + selectedText + '</div>' + editando.contenido.substring(end);
                          setEditando({...editando, contenido: newText});
                        }}
                        className="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-100 text-sm"
                        title="Centrar"
                      >
                        ↔️ Centro
                      </button>
                      
                      <button
                        type="button"
                        onClick={() => {
                          const textarea = document.getElementById('estatutos-textarea');
                          const start = textarea.selectionStart;
                          const end = textarea.selectionEnd;
                          const selectedText = editando.contenido.substring(start, end);
                          const newText = editando.contenido.substring(0, start) + '<div style="text-align:right">' + selectedText + '</div>' + editando.contenido.substring(end);
                          setEditando({...editando, contenido: newText});
                        }}
                        className="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-100 text-sm"
                        title="Alinear a la derecha"
                      >
                        ➡️ Derecha
                      </button>
                      
                      <button
                        type="button"
                        onClick={() => {
                          const textarea = document.getElementById('estatutos-textarea');
                          const start = textarea.selectionStart;
                          const end = textarea.selectionEnd;
                          const selectedText = editando.contenido.substring(start, end);
                          const newText = editando.contenido.substring(0, start) + '<div style="text-align:justify">' + selectedText + '</div>' + editando.contenido.substring(end);
                          setEditando({...editando, contenido: newText});
                        }}
                        className="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-100 text-sm"
                        title="Justificar"
                      >
                        ⬌ Justificar
                      </button>
                      
                      <div className="border-l border-gray-300 mx-1"></div>
                      
                      <button
                        type="button"
                        onClick={() => {
                          const textarea = document.getElementById('estatutos-textarea');
                          const start = textarea.selectionStart;
                          const newText = editando.contenido.substring(0, start) + '\n---\n' + editando.contenido.substring(start);
                          setEditando({...editando, contenido: newText});
                        }}
                        className="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-100 text-sm"
                        title="Línea horizontal"
                      >
                        ─ Línea
                      </button>
                      
                      <span className="text-xs text-gray-500 ml-auto self-center">
                        💡 Selecciona texto y usa los botones
                      </span>
                    </div>
                  </div>
                  
                  <textarea
                    id="estatutos-textarea"
                    value={editando.contenido}
                    onChange={(e) => setEditando({...editando, contenido: e.target.value})}
                    rows={20}
                    className="w-full px-4 py-2 border border-gray-300 rounded-b-lg focus:ring-2 focus:ring-green-500 text-sm"
                    style={{fontFamily: 'monospace', fontSize: '14px'}}
                  />
                  <div className="text-xs text-gray-600 mt-2 p-3 bg-blue-50 border border-blue-200 rounded">
                    <p className="font-semibold mb-1">📖 Atajos de formato:</p>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                      <span>**texto** = negrita</span>
                      <span>_texto_ = cursiva</span>
                      <span>~~texto~~ = tachado</span>
                      <span># = Título 1</span>
                      <span>## = Título 2</span>
                      <span>### = Título 3</span>
                      <span>- = viñeta</span>
                      <span>1. = numerada</span>
                      <span>--- = línea</span>
                    </div>
                  </div>
                </div>

                <div className="flex gap-4">
                  <button
                    onClick={guardarEstatutos}
                    className="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold flex items-center gap-2"
                  >
                    <Save size={20} />
                    Guardar Cambios
                  </button>
                  <button
                    onClick={() => { setEditando({...estatutos}); setModo('ver'); }}
                    className="px-6 py-3 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 font-semibold"
                  >
                    Cancelar
                  </button>
                </div>
              </>
            )}

            {modo === 'firmas' && (
              <>
                <h3 className="text-2xl font-bold mb-4">Firmas Digitales de Participantes</h3>
                <div className="mb-6 p-4 bg-purple-50 border border-purple-200 rounded">
                  <p className="text-sm text-purple-800">
                    <strong>💡 Instrucciones:</strong><br/>
                    - Sube una imagen de la firma de cada participante (máx 500KB)<br/>
                    - Formatos aceptados: JPG, PNG<br/>
                    - Las firmas se incluirán automáticamente en el documento imprimible
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {Object.values(participantes).map(p => {
                    const firma = firmasDigitales[p.consecutivo];
                    return (
                      <div key={p.consecutivo} className="border border-gray-300 rounded-lg p-4">
                        <div className="flex justify-between items-start mb-2">
                          <div>
                            <p className="font-semibold">{p.consecutivo} - {p.nombre}</p>
                            <p className="text-xs text-gray-500">{p.documento}</p>
                          </div>
                          {firma && (
                            <button
                              onClick={() => eliminarFirma(p.consecutivo)}
                              className="text-red-600 hover:text-red-800"
                            >
                              <X size={16} />
                            </button>
                          )}
                        </div>

                        {firma ? (
                          <div>
                            <img 
                              src={firma.firma} 
                              alt="Firma" 
                              className="w-full h-24 object-contain border border-gray-300 bg-white"
                            />
                            <p className="text-xs text-gray-500 mt-1">
                              Firmado: {new Date(firma.fecha).toLocaleString('es-CO')}
                            </p>
                          </div>
                        ) : (
                          <div>
                            <label className="block cursor-pointer">
                              <div className="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center hover:border-purple-500">
                                <Plus className="mx-auto mb-2 text-gray-400" />
                                <p className="text-sm text-gray-600">Subir firma</p>
                              </div>
                              <input
                                type="file"
                                accept="image/*"
                                onChange={(e) => subirFirmaDigital(p.consecutivo, e)}
                                className="hidden"
                              />
                            </label>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                {Object.keys(participantes).length === 0 && (
                  <div className="text-center py-12">
                    <Users className="w-16 h-16 text-gray-300 mx-auto mb-4" />
                    <p className="text-gray-500">No hay participantes registrados</p>
                  </div>
                )}
              </>
            )}

            {modo === 'documento' && (
              <>
                <h3 className="text-2xl font-bold mb-4">Documento Firmado</h3>
                <div className="mb-6 p-4 bg-orange-50 border border-orange-200 rounded">
                  <p className="text-sm text-orange-800">
                    <strong>📄 Instrucciones:</strong><br/>
                    - Imprime el documento con "Generar Documento Optimizado"<br/>
                    - Recoge las firmas físicas<br/>
                    - Escanea o fotografía el documento<br/>
                    - Sube el archivo aquí (PDF o imagen, máx 5MB)
                  </p>
                </div>

                {documentoFirmado ? (
                  <div className="space-y-4">
                    <div className="p-6 border-2 border-green-500 rounded-lg bg-green-50">
                      <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center gap-3">
                          <FileText className="text-green-600" size={32} />
                          <div>
                            <p className="font-semibold text-green-800">Documento cargado ✓</p>
                            <p className="text-sm text-green-600">El documento firmado está guardado</p>
                          </div>
                        </div>
                        <button
                          onClick={eliminarDocumentoFirmado}
                          className="text-red-600 hover:text-red-800"
                        >
                          <X size={24} />
                        </button>
                      </div>

                      {documentoFirmado.startsWith('data:image') && (
                        <img 
                          src={documentoFirmado} 
                          alt="Documento" 
                          className="w-full max-h-96 object-contain border border-gray-300"
                        />
                      )}

                      <button
                        onClick={descargarDocumentoFirmado}
                        className="mt-4 w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center justify-center gap-2"
                      >
                        <Download size={20} />
                        Descargar Documento
                      </button>
                    </div>
                  </div>
                ) : (
                  <div>
                    <label className="block cursor-pointer">
                      <div className="border-4 border-dashed border-gray-300 rounded-lg p-12 text-center hover:border-orange-500 transition-colors">
                        <Plus className="mx-auto mb-4 text-gray-400" size={48} />
                        <p className="text-lg font-semibold text-gray-700 mb-2">
                          Subir documento firmado
                        </p>
                        <p className="text-sm text-gray-500">
                          PDF o imagen (máx 5MB)
                        </p>
                      </div>
                      <input
                        type="file"
                        accept="image/*,.pdf"
                        onChange={subirDocumentoFirmado}
                        className="hidden"
                      />
                    </label>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      </div>
    );
  };

  // ============================================
  // RENDER PRINCIPAL
  // ============================================

  // Pantalla de carga
  if (cargandoClave) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
        <div className="animate-spin rounded-full h-16 w-16 border-b-4 border-indigo-600"></div>
      </div>
    );
  }

  // Pantalla de configuración de clave (primer uso)
  if (!claveConfigurada) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
        <div className="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full">
          <div className="text-center mb-6">
            <div className="bg-indigo-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4">
              <Settings size={40} className="text-indigo-600" />
            </div>
            <h1 className="text-3xl font-bold text-gray-800 mb-2">Bienvenido</h1>
            <p className="text-gray-600">Configura una clave para proteger tu sistema</p>
          </div>
          
          <form onSubmit={(e) => {
            e.preventDefault();
            const clave = e.target.clave.value;
            const confirmar = e.target.confirmar.value;
            
            if (clave !== confirmar) {
              alert('❌ Las claves no coinciden');
              return;
            }
            
            configurarClavePrimeraVez(clave);
          }}>
            <div className="mb-4">
              <label className="block text-sm font-medium text-gray-700 mb-2">
                Nueva Clave (mínimo 4 caracteres)
              </label>
              <input
                type="password"
                name="clave"
                required
                minLength="4"
                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                placeholder="Ingresa tu clave"
              />
            </div>
            
            <div className="mb-6">
              <label className="block text-sm font-medium text-gray-700 mb-2">
                Confirmar Clave
              </label>
              <input
                type="password"
                name="confirmar"
                required
                minLength="4"
                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                placeholder="Confirma tu clave"
              />
            </div>
            
            <button
              type="submit"
              className="w-full px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold transition-colors"
            >
              Configurar y Comenzar
            </button>
            
            <div className="mt-4 p-3 bg-yellow-50 border border-yellow-200 rounded">
              <p className="text-xs text-yellow-800">
                ⚠️ <strong>Importante:</strong> Recuerda tu clave. La necesitarás cada vez que abras el sistema y para resetear datos.
              </p>
            </div>
          </form>
        </div>
      </div>
    );
  }

  // Pantalla de login
  if (!autenticado) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
        <div className="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full">
          <div className="text-center mb-6">
            <div className="bg-indigo-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4">
              <Home size={40} className="text-indigo-600" />
            </div>
            <h1 className="text-3xl font-bold text-gray-800 mb-2">Sistema de Ahorro</h1>
            <p className="text-gray-600">Ingresa tu clave para continuar</p>
          </div>
          
          <form onSubmit={(e) => {
            e.preventDefault();
            const clave = e.target.clave.value;
            validarClave(clave);
            e.target.reset();
          }}>
            <div className="mb-6">
              <label className="block text-sm font-medium text-gray-700 mb-2">
                Clave de Acceso
              </label>
              <input
                type="password"
                name="clave"
                required
                autoFocus
                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                placeholder="Ingresa tu clave"
              />
            </div>
            
            <button
              type="submit"
              className="w-full px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold transition-colors"
            >
              Ingresar al Sistema
            </button>
          </form>
        </div>
      </div>
    );
  }

  // Sistema principal (cuando está autenticado)
  return (
    <div className="font-sans min-h-screen flex flex-col">
      <div className="flex-grow">
      {seccionActual === 'menu' && <MenuPrincipal />}
      {seccionActual === 'configuracion' && <Configuracion />}
      {seccionActual === 'seccion1' && <Seccion1 />}
      {seccionActual === 'seccion2' && <Seccion2 />}
      {seccionActual === 'seccion3' && <Seccion3 />}
      {seccionActual === 'seccion4' && <Seccion4 />}
      {seccionActual === 'seccion5' && <Seccion5 />}
      {seccionActual === 'seccion6' && <Seccion6 />}
      {seccionActual === 'seccion7' && <Seccion7 />}
      {seccionActual === 'seccion8' && <Seccion8 />}
      {seccionActual === 'seccion9' && <Seccion9 />}
      {seccionActual === 'seccion10' && <Seccion10 />}
      {seccionActual === 'caja' && <SeccionCaja />}
    </div>
	
	<div className="text-center py-6 bg-gray-50 border-t no-print">
        <p className="text-xs text-gray-900 font-semibold">
          Powered by: Ing Rafael Ramos De La Cruz
        </p>
        <p className="text-xs text-gray-500 mt-1">
          © 2026 - Todos los derechos reservados
        </p>
      </div>
    </div>
  );
};



    

    

    

    // Render
    try {
      const hideLoading = () => {
        const el = document.getElementById('loading-screen');
        if (el) {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.5s';
          setTimeout(() => el.remove(), 500);
        }
      };
      
      ReactDOM.render(<SistemaAhorroComunitario />, document.getElementById('root'));
      setTimeout(hideLoading, 500);
      console.log('✅ Sistema cargado correctamente');
    } catch (error) {
      console.error('❌ Error:', error);
      document.getElementById('root').innerHTML = 
        '<div style="padding:40px;text-align:center;font-family:Arial;">' +
        '<h1 style="color:red;">Error al cargar</h1>' +
        '<p>' + error.message + '</p>' +
        '<p style="margin-top:20px;color:#666;">Presiona F12 para ver detalles en la consola.</p>' +
        '</div>';
    }
  </script>
</body>
</html>
