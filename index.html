  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
    * { box-sizing: border-box; }
    @media print {
      .no-print { display: none !important; }
      @page { size: letter; margin: 2cm; }
    }
    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; color: white;
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.3); border-radius: 50%;
      border-top: 4px solid white; width: 50px; height: 50px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-text { margin-top: 20px; font-size: 18px; font-weight: 500; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Cargando Sistema de Ahorro...</div>
  </div>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;
    
    // Storage simulator
    if (!window.storage) {
      window.storage = {
        async get(key) {
          try {
            const value = localStorage.getItem(key);
            return value ? { key, value } : null;
          } catch (err) {
            console.error('Error getting storage:', err);
            return null;
          }
        },
        async set(key, value) {
          try {
            localStorage.setItem(key, value);
            return { key, value };
          } catch (err) {
            console.error('Error setting storage:', err);
            throw err;
          }
        },
        async delete(key) {
          try {
            localStorage.removeItem(key);
            return { key, deleted: true };
          } catch (err) {
            console.error('Error deleting storage:', err);
            throw err;
          }
        }
      };
    }
    
    // Icons
    const Calendar = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

      </svg>
    );
    const DollarSign = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
    const TrendingUp = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
    const Users = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
    const FileText = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>;
    const BarChart3 = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>;
    const Settings = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6"/><path d="m4.93 4.93 4.24 4.24m5.66 5.66 4.24 4.24"/><path d="M1 12h6m6 0h6"/><path d="m4.93 19.07 4.24-4.24m5.66-5.66 4.24-4.24"/></svg>;
    const Save = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
    const Home = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const Plus = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const Download = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const X = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const Edit2 = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>;
    const Check = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;








const SistemaAhorroComunitario = () => {
  const [autenticado, setAutenticado] = useState(false);
  const [claveConfigurada, setClaveConfigurada] = useState(false);
  const [cargandoClave, setCargandoClave] = useState(true);
  const [seccionActual, setSeccionActual] = useState('menu');
  const [config, setConfig] = useState({
    porcentaje: 10,
    periodoInicio: '2026-01',
    periodoFin: '2026-12'
  });
  const [participantes, setParticipantes] = useState({});
  const [prestamos, setPrestamos] = useState({});
  const [consecutivoParticipante, setConsecutivoParticipante] = useState(1);
  const [consecutivoPrestamo, setConsecutivoPrestamo] = useState(1);
  const [multas, setMultas] = useState({});
  const [consecutivoMulta, setConsecutivoMulta] = useState(1);
  const [montoMultaConfig, setMontoMultaConfig] = useState(5000);
  const [gastos, setGastos] = useState({});
  const [consecutivoGasto, setConsecutivoGasto] = useState(1);
  const [ajustesCaja, setAjustesCaja] = useState([]); // Monto por defecto

  useEffect(() => {
    verificarClave();
  }, []);

  const verificarClave = async () => {
    try {
      const datos = await window.storage.get('clave-sistema');
      setClaveConfigurada(!!datos);
    } catch (err) {
      console.log('No hay clave configurada');
    } finally {
      setCargandoClave(false);
    }
  };

  const configurarClavePrimeraVez = async (clave) => {
    if (!clave || clave.length < 4) {
      alert('❌ La clave debe tener al menos 4 caracteres');
      return;
    }
    try {
      await window.storage.set('clave-sistema', clave);
      setClaveConfigurada(true);
      setAutenticado(true);
      alert('✓ Clave configurada exitosamente');
    } catch (err) {
      alert('❌ Error al configurar clave: ' + err.message);
    }
  };

  const validarClave = async (clave) => {
    try {
      const datos = await window.storage.get('clave-sistema');
      if (datos && datos.value === clave) {
        setAutenticado(true);
        return true;
      } else {
        alert('❌ Clave incorrecta');
        return false;
      }
    } catch (err) {
      alert('❌ Error al validar clave');
      return false;
    }
  };

  const solicitarClaveParaResetear = async () => {
    const clave = prompt('🔒 Ingresa la clave para resetear el sistema:');
    if (!clave) return false;
    
    const datos = await window.storage.get('clave-sistema');
    if (datos && datos.value === clave) {
      return true;
    } else {
      alert('❌ Clave incorrecta');
      return false;
    }
  };

  const formatearMoneda = (valor) => {
    if (!valor && valor !== 0) return '$0';
    return '$' + Math.round(valor).toLocaleString('es-CO');
  };

  const generarMeses = useCallback(() => {
    const meses = [];
    const [anoInicio, mesInicio] = config.periodoInicio.split('-').map(Number);
    const [anoFin, mesFin] = config.periodoFin.split('-').map(Number);
    
    let anoActual = anoInicio;
    let mesActual = mesInicio;
    
    while (anoActual < anoFin || (anoActual === anoFin && mesActual <= mesFin)) {
      const mesStr = String(mesActual).padStart(2, '0');
      meses.push(`${anoActual}-${mesStr}`);
      
      mesActual++;
      if (mesActual > 12) {
        mesActual = 1;
        anoActual++;
      }
    }
    
    return meses.length > 0 ? meses : [config.periodoInicio];
  }, [config.periodoInicio, config.periodoFin]);

  const mesesPeriodo = generarMeses();

  const nombreMes = (mesKey) => {
    const [year, month] = mesKey.split('-');
    const meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
    return `${meses[parseInt(month) - 1]}-${year.slice(2)}`;
  };

  // ============================================
  // CÁLCULOS - PRÉSTAMOS CON INTERESES AUTOMÁTICOS
  // ============================================

  const calcularEstadoPrestamo = useCallback((prestamo, hastaMes) => {
    let saldo = prestamo.monto;
    let interesesAcumulados = 0;
    
    const indexOtorgamiento = mesesPeriodo.indexOf(prestamo.mesOtorgamiento);
    const indexHasta = mesesPeriodo.indexOf(hastaMes);
    
    for (let i = indexOtorgamiento + 1; i <= indexHasta; i++) {
      const mes = mesesPeriodo[i];
      const interesMes = saldo * (config.porcentaje / 100);
      const pago = prestamo.pagosRealizados?.find(p => p.mes === mes);
      
      if (pago) {
        saldo -= (pago.abonoCapital || 0);
        const interesesPagados = pago.interesesPagados || 0;
        const interesesCapitalizados = interesMes - interesesPagados;
        saldo += interesesCapitalizados;
        interesesAcumulados += interesMes;
      } else {
        saldo += interesMes;
        interesesAcumulados += interesMes;
      }
    }
    
    return { saldo, interesesAcumulados };
  }, [mesesPeriodo, config.porcentaje]);

  const calcularInteresMes = useCallback((prestamo, mes) => {
    const indexMes = mesesPeriodo.indexOf(mes);
    const indexOtorgamiento = mesesPeriodo.indexOf(prestamo.mesOtorgamiento);
    
    if (indexMes <= indexOtorgamiento) return 0;
    
    const mesAnterior = mesesPeriodo[indexMes - 1];
    const estado = calcularEstadoPrestamo(prestamo, mesAnterior);
    
    return estado.saldo * (config.porcentaje / 100);
  }, [mesesPeriodo, calcularEstadoPrestamo, config.porcentaje]);

  const calcularTotalesParticipante = useCallback((participanteId) => {
    const prestamosParticipante = Object.values(prestamos).filter(
      p => p.participanteId === participanteId && p.estado === 'Activo'
    );
    
    let totalDeuda = 0;
    let totalIntereses = 0;
    
    prestamosParticipante.forEach(prestamo => {
      const ultimoMes = mesesPeriodo[mesesPeriodo.length - 1];
      const estado = calcularEstadoPrestamo(prestamo, ultimoMes);
      totalDeuda += estado.saldo;
      totalIntereses += estado.interesesAcumulados;
    });
    
    return { totalDeuda, totalIntereses, cantidadPrestamos: prestamosParticipante.length };
  }, [prestamos, mesesPeriodo, calcularEstadoPrestamo]);

  // ============================================
  // CÁLCULOS - MULTAS Y DISPONIBLE
  // ============================================

  const calcularMultasParticipante = useCallback((participanteId, hastaMes = null) => {
    const multasParticipante = Object.values(multas).filter(m => m.participanteId === participanteId && m.pagada);
    if (hastaMes) {
      return multasParticipante
        .filter(m => m.mes <= hastaMes)
        .reduce((sum, m) => sum + (m.monto || 0), 0);
    }
    return multasParticipante.reduce((sum, m) => sum + (m.monto || 0), 0);
  }, [multas]);

  const calcularMultasTotales = useCallback((hastaMes = null) => {
    const multasPagadas = Object.values(multas).filter(m => m.pagada);
    if (hastaMes) {
      return multasPagadas
        .filter(m => m.mes <= hastaMes)
        .reduce((sum, m) => sum + (m.monto || 0), 0);
    }
    return multasPagadas.reduce((sum, m) => sum + (m.monto || 0), 0);
  }, [multas]);

  const calcularGastosTotales = useCallback((hastaMes = null) => {
    if (hastaMes) {
      return Object.values(gastos)
        .filter(g => g.mes <= hastaMes)
        .reduce((sum, g) => sum + (g.monto || 0), 0);
    }
    return Object.values(gastos).reduce((sum, g) => sum + (g.monto || 0), 0);
  }, [gastos]);

  const calcularCuotaGastosPorParticipante = useCallback((hastaMes = null) => {
    const totalGastos = calcularGastosTotales(hastaMes);
    const cantidadParticipantes = Object.keys(participantes).length;
    return cantidadParticipantes > 0 ? totalGastos / cantidadParticipantes : 0;
  }, [gastos, participantes]);

  const calcularCaja = useCallback((hastaMes = null) => {
    const mes = hastaMes || mesesPeriodo[mesesPeriodo.length - 1];
    const disponible = calcularDisponibleTotal(mes);
    const prestamosActivos = Object.values(prestamos)
      .filter(p => p.estado === 'Activo')
      .reduce((sum, p) => {
        const estado = calcularEstadoPrestamo(p, mes);
        return sum + estado.saldo;
      }, 0);
    
    const ajustesHastaMes = ajustesCaja
      .filter(a => a.mes <= mes)
      .reduce((sum, a) => sum + a.monto, 0);
    
    return disponible - prestamosActivos + ajustesHastaMes;
  }, [mesesPeriodo, calcularDisponibleTotal, prestamos, ajustesCaja]);

  const calcularCupoParticipante = useCallback((participanteId, hastaMes) => {
    const ahorro = calcularAhorroHastaMes(participanteId, hastaMes);
    const utilidad = calcularUtilidadProductividadAcumulada(participanteId, hastaMes);
    const sobreUtilidad = calcularSobreUtilidadProductividadAcumulada(participanteId, hastaMes);
    const totales = calcularTotalesParticipante(participanteId);
    
    return ahorro + utilidad + sobreUtilidad - totales.totalDeuda;
  }, [calcularAhorroHastaMes, calcularUtilidadProductividadAcumulada, calcularSobreUtilidadProductividadAcumulada, calcularTotalesParticipante]);

  const calcularDisponibleTotal = useCallback((hastaMes) => {
    let totalAhorros = 0;
    let totalUtilidades = 0;
    let totalSobreUtilidades = 0;
    let totalDeudas = 0;
    
    Object.keys(participantes).forEach(participanteId => {
      totalAhorros += calcularAhorroHastaMes(participanteId, hastaMes);
      totalUtilidades += calcularUtilidadProductividadAcumulada(participanteId, hastaMes);
      totalSobreUtilidades += calcularSobreUtilidadProductividadAcumulada(participanteId, hastaMes);
      
      const totales = calcularTotalesParticipante(participanteId);
      totalDeudas += totales.totalDeuda;
    });
    
    const totalMultas = calcularMultasTotales(hastaMes);
    const totalGastos = calcularGastosTotales(hastaMes);
    
    return totalAhorros + totalUtilidades + totalSobreUtilidades + totalMultas - totalDeudas - totalGastos;
  }, [participantes, calcularAhorroHastaMes, calcularUtilidadProductividadAcumulada, calcularSobreUtilidadProductividadAcumulada, calcularTotalesParticipante, calcularMultasTotales, calcularGastosTotales]);

  // ============================================
  // CÁLCULOS - UTILIDAD TRADICIONAL
  // ============================================

  const calcularAhorroHastaMes = (participanteId, hastaMes) => {
    const p = participantes[participanteId];
    if (!p || !p.ahorrosMensuales) return 0;
    return p.ahorrosMensuales
      .filter(a => a.mes <= hastaMes)
      .reduce((sum, a) => sum + (a.cantidad || 0), 0);
  };

  const calcularUtilidadTradicionalMes = (participanteId, mes) => {
    const indexMes = mesesPeriodo.indexOf(mes);
    if (indexMes <= 0) return 0;
    
    const mesAnterior = mesesPeriodo[indexMes - 1];
    const ahorroAcumulado = calcularAhorroHastaMes(participanteId, mesAnterior);
    return ahorroAcumulado * (config.porcentaje / 100);
  };

  const calcularUtilidadTradicionalAcumulada = (participanteId, hastaMes) => {
    let total = 0;
    mesesPeriodo.forEach(mes => {
      if (mes <= hastaMes) {
        total += calcularUtilidadTradicionalMes(participanteId, mes);
      }
    });
    return total;
  };

  const calcularSobreUtilidadTradicionalMes = (participanteId, mes) => {
    const indexMes = mesesPeriodo.indexOf(mes);
    if (indexMes <= 1) return 0;
    
    const mesAnterior = mesesPeriodo[indexMes - 1];
    const utilidadAcumulada = calcularUtilidadTradicionalAcumulada(participanteId, mesAnterior);
    return utilidadAcumulada * (config.porcentaje / 100);
  };

  const calcularSobreUtilidadTradicionalAcumulada = (participanteId, hastaMes) => {
    let total = 0;
    mesesPeriodo.forEach(mes => {
      if (mes <= hastaMes) {
        total += calcularSobreUtilidadTradicionalMes(participanteId, mes);
      }
    });
    return total;
  };

  // ============================================
  // CÁLCULOS - UTILIDAD POR PRODUCTIVIDAD
  // ============================================

  const calcularUtilidadProductividadMes = (participanteId, mes) => {
    let total = 0;
    Object.values(prestamos).forEach(prestamo => {
      if (prestamo.participanteId === participanteId && prestamo.pagosRealizados) {
        prestamo.pagosRealizados.forEach(pago => {
          if (pago.mes === mes) {
            total += pago.interesesPagados || 0;
          }
        });
      }
    });
    return total;
  };

  const calcularUtilidadProductividadAcumulada = (participanteId, hastaMes) => {
    let total = 0;
    mesesPeriodo.forEach(mes => {
      if (mes <= hastaMes) {
        total += calcularUtilidadProductividadMes(participanteId, mes);
      }
    });
    return total;
  };

  const calcularSobreUtilidadProductividadMes = (participanteId, mes) => {
    const indexMes = mesesPeriodo.indexOf(mes);
    if (indexMes <= 1) return 0;
    
    const mesAnterior = mesesPeriodo[indexMes - 1];
    
    // Solo calcular sobre-utilidad si hubo utilidad en el mes anterior
    const utilidadMesAnterior = calcularUtilidadProductividadMes(participanteId, mesAnterior);
    if (utilidadMesAnterior === 0) return 0;
    
    const utilidadAcumulada = calcularUtilidadProductividadAcumulada(participanteId, mesAnterior);
    return utilidadAcumulada * (config.porcentaje / 100);
  };

  const calcularSobreUtilidadProductividadAcumulada = (participanteId, hastaMes) => {
    let total = 0;
    mesesPeriodo.forEach(mes => {
      if (mes <= hastaMes) {
        total += calcularSobreUtilidadProductividadMes(participanteId, mes);
      }
    });
    return total;
  };

  const calcularAhorroTotal = (participanteId) => {
    const p = participantes[participanteId];
    if (!p || !p.ahorrosMensuales) return 0;
    return p.ahorrosMensuales.reduce((sum, a) => sum + (a.cantidad || 0), 0);
  };

  // ============================================
  // ALMACENAMIENTO
  // ============================================

  useEffect(() => {
    cargarDatos();
  }, []);

  const cargarDatos = async () => {
    try {
      const datos = await window.storage.get('sistemaAhorro');
      if (datos) {
        const parsed = JSON.parse(datos.value);
        setConfig(parsed.config || {
          porcentaje: 10,
          periodoInicio: '2026-01',
          periodoFin: '2026-12'
        });
        setParticipantes(parsed.participantes || {});
        setPrestamos(parsed.prestamos || {});
        setConsecutivoParticipante(parsed.consecutivoParticipante || 1);
        setConsecutivoPrestamo(parsed.consecutivoPrestamo || 1);
        setMultas(parsed.multas || {});
        setConsecutivoMulta(parsed.consecutivoMulta || 1);
        setMontoMultaConfig(parsed.montoMultaConfig || 5000);
        setGastos(parsed.gastos || {});

  const SeccionCaja = () => {
    const [mesSeleccionado, setMesSeleccionado] = useState(mesesPeriodo[mesesPeriodo.length - 1]);
    const [montoAjuste, setMontoAjuste] = useState('');
    const [justificacion, setJustificacion] = useState('');
    const [tipoAjuste, setTipoAjuste] = useState('ingreso');

    const disponible = calcularDisponibleTotal(mesSeleccionado);
    const prestamosActivos = useMemo(() => {
      return Object.values(prestamos)
        .filter(p => p.estado === 'Activo')
        .reduce((sum, p) => {
          const estado = calcularEstadoPrestamo(p, mesSeleccionado);
          return sum + estado.saldo;
        }, 0);
    }, [prestamos, mesSeleccionado]);

    const cajaCalculada = disponible - prestamosActivos;
    const ajustesDelMes = ajustesCaja.filter(a => a.mes === mesSeleccionado);
    const totalAjustes = ajustesDelMes.reduce((sum, a) => sum + a.monto, 0);
    const cajaFinal = cajaCalculada + totalAjustes;

    const registrarAjuste = () => {
      if (!montoAjuste || parseFloat(montoAjuste) === 0) {
        alert('❌ Ingrese un monto válido');
        return;
      }
      if (!justificacion.trim()) {
        alert('❌ La justificación es obligatoria');
        return;
      }

      const monto = tipoAjuste === 'egreso' ? -Math.abs(parseFloat(montoAjuste)) : Math.abs(parseFloat(montoAjuste));

      const nuevoAjuste = {
        id: Date.now(),
        mes: mesSeleccionado,
        monto,
        justificacion: justificacion.trim(),
        fecha: new Date().toISOString()
      };

      setAjustesCaja([...ajustesCaja, nuevoAjuste]);
      setMontoAjuste('');
      setJustificacion('');
      alert('✓ Ajuste registrado exitosamente');
    };

    const eliminarAjuste = (ajusteId) => {
      if (!window.confirm('¿Eliminar este ajuste?')) return;
      setAjustesCaja(ajustesCaja.filter(a => a.id !== ajusteId));
      alert('✓ Ajuste eliminado');
    };

    const verificacionCuadre = Math.abs(cajaFinal) < 1000 ? 'success' : Math.abs(cajaFinal) < 5000 ? 'warning' : 'error';

    return (
      <div className="min-h-screen bg-gray-50 p-4 md:p-8">
        <div className="max-w-7xl mx-auto">
          <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
              <div>
                <h2 className="text-2xl md:text-3xl font-bold text-gray-800">Control de Caja</h2>
                <p className="text-gray-600">Verificación y cuadre de caja</p>
              </div>
              <BotonVolver />
            </div>

            {/* Selector de mes */}
            <div className="mb-6">
              <label className="block text-sm font-medium text-gray-700 mb-2">Mes:</label>
              <select
                value={mesSeleccionado}
                onChange={(e) => setMesSeleccionado(e.target.value)}
                className="px-4 py-2 border border-gray-300 rounded-lg"
              >
                {mesesPeriodo.map(mes => (
                  <option key={mes} value={mes}>{nombreMes(mes)}</option>
                ))}
              </select>
            </div>

            {/* Cálculo de Caja */}
            <div className="bg-blue-50 border-2 border-blue-300 rounded-lg p-6 mb-6">
              <h3 className="text-lg font-bold mb-4">Cálculo Automático de Caja</h3>
              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <span className="text-gray-700">Disponible Total:</span>
                  <span className="text-xl font-bold text-green-600">{formatearMoneda(disponible)}</span>
                </div>
                <div className="flex justify-between items-center">
                  <span className="text-gray-700">(-) Préstamos Activos:</span>
                  <span className="text-xl font-bold text-red-600">{formatearMoneda(prestamosActivos)}</span>
                </div>
                <div className="border-t-2 border-blue-300 pt-3 flex justify-between items-center">
                  <span className="text-gray-700 font-semibold">Caja Calculada:</span>
                  <span className="text-2xl font-bold text-blue-600">{formatearMoneda(cajaCalculada)}</span>
                </div>
                {totalAjustes !== 0 && (
                  <>
                    <div className="flex justify-between items-center">
                      <span className="text-gray-700">(+/-) Ajustes:</span>
                      <span className={`text-xl font-bold ${totalAjustes >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                        {formatearMoneda(totalAjustes)}
                      </span>
                    </div>
                    <div className="border-t-2 border-blue-300 pt-3 flex justify-between items-center">
                      <span className="text-gray-700 font-semibold">Caja Final:</span>
                      <span className="text-2xl font-bold text-blue-800">{formatearMoneda(cajaFinal)}</span>
                    </div>
                  </>
                )}
              </div>
            </div>

            {/* Verificación de Cuadre */}
            <div className={`border-2 rounded-lg p-4 mb-6 ${
              verificacionCuadre === 'success' ? 'bg-green-50 border-green-300' :
              verificacionCuadre === 'warning' ? 'bg-yellow-50 border-yellow-300' :
              'bg-red-50 border-red-300'
            }`}>
              <div className="flex items-center gap-3">
                <div className={`w-12 h-12 rounded-full flex items-center justify-center ${
                  verificacionCuadre === 'success' ? 'bg-green-500' :
                  verificacionCuadre === 'warning' ? 'bg-yellow-500' :
                  'bg-red-500'
                }`}>
                  {verificacionCuadre === 'success' ? (
                    <Check className="w-6 h-6 text-white" />
                  ) : (
                    <span className="text-white text-xl font-bold">!</span>
                  )}
                </div>
                <div>
                  <p className={`font-bold ${
                    verificacionCuadre === 'success' ? 'text-green-800' :
                    verificacionCuadre === 'warning' ? 'text-yellow-800' :
                    'text-red-800'
                  }`}>
                    {verificacionCuadre === 'success' ? '✓ Caja Cuadrada' :
                     verificacionCuadre === 'warning' ? '⚠ Diferencia Menor' :
                     '✗ Diferencia Importante'}
                  </p>
                  <p className="text-sm text-gray-600">
                    {verificacionCuadre === 'success' ? 'La caja está correctamente cuadrada' :
                     verificacionCuadre === 'warning' ? 'Hay una pequeña diferencia, revisar' :
                     'Hay una diferencia significativa, requiere ajuste'}
                  </p>
                </div>
              </div>
            </div>

            {/* Formulario de Ajuste */}
            <div className="bg-purple-50 border-2 border-purple-300 rounded-lg p-4 mb-6">
              <h3 className="text-lg font-bold mb-4">Registrar Ajuste Manual</h3>
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                  <label className="block text-sm font-medium mb-2">Tipo:</label>
                  <select
                    value={tipoAjuste}
                    onChange={(e) => setTipoAjuste(e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg"
                  >
                    <option value="ingreso">Ingreso (+)</option>
                    <option value="egreso">Egreso (-)</option>
                  </select>
                </div>
                <div>
                  <label className="block text-sm font-medium mb-2">Monto:</label>
                  <input
                    type="number"
                    value={montoAjuste}
                    onChange={(e) => setMontoAjuste(e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg"
                    placeholder="0"
                  />
                </div>
                <div className="md:col-span-2">
                  <label className="block text-sm font-medium mb-2">Justificación:</label>
                  <input
                    type="text"
                    value={justificacion}
                    onChange={(e) => setJustificacion(e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg"
                    placeholder="Ej: Error de conteo"
                  />
                </div>
              </div>
              <button
                onClick={registrarAjuste}
                className="mt-4 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700"
              >
                Registrar Ajuste
              </button>
            </div>

            {/* Historial de Ajustes */}
            {ajustesDelMes.length > 0 && (
              <div className="overflow-x-auto">
                <h3 className="text-lg font-bold mb-3">Ajustes del Mes</h3>
                <table className="w-full border-collapse text-sm">
                  <thead>
                    <tr className="bg-purple-100">
                      <th className="border border-gray-300 px-2 py-2 text-left">Fecha</th>
                      <th className="border border-gray-300 px-2 py-2 text-left">Justificación</th>
                      <th className="border border-gray-300 px-2 py-2 text-right">Monto</th>
                      <th className="border border-gray-300 px-2 py-2 text-center">Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    {ajustesDelMes.map(a => (
                      <tr key={a.id} className="hover:bg-gray-50">
                        <td className="border border-gray-300 px-2 py-2 text-xs">
                          {new Date(a.fecha).toLocaleDateString('es-CO')}
                        </td>
                        <td className="border border-gray-300 px-2 py-2">{a.justificacion}</td>
                        <td className={`border border-gray-300 px-2 py-2 text-right font-semibold ${
                          a.monto >= 0 ? 'text-green-600' : 'text-red-600'
                        }`}>
                          {a.monto >= 0 ? '+' : ''}{formatearMoneda(a.monto)}

                        <td className="border border-gray-300 px-2 py-2 text-center">
                          <button
                            onClick={() => eliminarAjuste(a.id)}
                            className="text-red-600 hover:text-red-800"
                            title="Eliminar"

                            <X size={18} />
                          </button>

              </div>

          </div>
        </div>

    const [vista, setVista] = useState('tabla');
    const [nuevoParticipante, setNuevoParticipante] = useState({
      nombre: '',
      documento: '',
      direccion: '',
      telefono: ''
    });
    const [participanteEditando, setParticipanteEditando] = useState(null);
    const [datosEditando, setDatosEditando] = useState({
      nombre: '',
      documento: '',
      direccion: '',
      telefono: ''
    });
    const [ahorrosMes, setAhorrosMes] = useState({});
    const [mesActual, setMesActual] = useState(mesesPeriodo[0]);

    const agregarParticipante = () => {
      if (!nuevoParticipante.nombre || !nuevoParticipante.documento) {
        alert('❌ Nombre y documento son obligatorios');
        return;
      }

      const consecutivo = String(consecutivoParticipante).padStart(3, '0');
      const nuevo = {
        consecutivo,
        ...nuevoParticipante,
        activo: true,
        ahorrosMensuales: []
      };

      setParticipantes({...participantes, [consecutivo]: nuevo});
      setConsecutivoParticipante(consecutivoParticipante + 1);
      setNuevoParticipante({ nombre: '', documento: '', direccion: '', telefono: '' });
      setVista('tabla');
      alert('✓ Participante agregado exitosamente');
    };

    const iniciarEdicion = (participante) => {
      setParticipanteEditando(participante.consecutivo);
      setDatosEditando({
        nombre: participante.nombre,
        documento: participante.documento,
        direccion: participante.direccion || '',
        telefono: participante.telefono || ''
      });
      setVista('editar');
    };

    const guardarEdicion = () => {
      if (!datosEditando.nombre || !datosEditando.documento) {
        alert('❌ Nombre y documento son obligatorios');
        return;
      }

      const actualizado = {
        ...participantes[participanteEditando],
        nombre: datosEditando.nombre,
        documento: datosEditando.documento,
        direccion: datosEditando.direccion,
        telefono: datosEditando.telefono
      };

      setParticipantes({
        ...participantes,
        [participanteEditando]: actualizado
      });

      setParticipanteEditando(null);
      setDatosEditando({ nombre: '', documento: '', direccion: '', telefono: '' });
      setVista('tabla');
      alert('✓ Participante actualizado exitosamente');
    };

    const cancelarEdicion = () => {
      setParticipanteEditando(null);
      setDatosEditando({ nombre: '', documento: '', direccion: '', telefono: '' });
      setVista('tabla');
    };

    const registrarAhorrosMes = () => {
      const actualizados = {...participantes};
      let totalRegistrado = 0;

      Object.keys(ahorrosMes).forEach(participanteId => {
        const monto = parseFloat(ahorrosMes[participanteId] || 0);
        const p = actualizados[participanteId];
        if (!p) return;

        const yaRegistrado = p.ahorrosMensuales?.find(a => a.mes === mesActual);
        
        if (yaRegistrado) {
          actualizados[participanteId] = {
            ...p,
            ahorrosMensuales: p.ahorrosMensuales.map(a => 
              a.mes === mesActual ? {...a, cantidad: monto} : a
            )
          };
          totalRegistrado++;
        } else if (monto > 0) {
          actualizados[participanteId] = {
            ...p,
            ahorrosMensuales: [...(p.ahorrosMensuales || []), {
              mes: mesActual,
              cantidad: monto,
              fecha: new Date().toISOString()
            }]
          };
          totalRegistrado++;
        }
      });

      setParticipantes(actualizados);
      setAhorrosMes({});
      alert(`✓ Ahorros registrados/actualizados para ${totalRegistrado} participante(s)`);
    };

    const obtenerAhorroMes = (participanteId, mes) => {
      const p = participantes[participanteId];
      if (!p || !p.ahorrosMensuales) return 0;
      const ahorro = p.ahorrosMensuales.find(a => a.mes === mes);
      return ahorro ? ahorro.cantidad : 0;
    };

    useEffect(() => {
      const inicial = {};
      Object.keys(participantes).forEach(id => {
        inicial[id] = obtenerAhorroMes(id, mesActual);
      });
      setAhorrosMes(inicial);
    }, [mesActual]);

    if (vista === 'agregar') {
      return (
        <div className="min-h-screen bg-gray-50 p-4 md:p-8">

                    className="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 font-semibold"
                  />
                </div>

                <div>

                    placeholder="123456789"

                </div>

                <div>

                  <input

                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Teléfono</label>

                    placeholder="3001234567"
                  />
                </div>
              </div>

              <div className="mt-8 flex flex-col sm:flex-row gap-4">
                <button

                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }
    if (vista === 'editar') {
      return (
        <div className="min-h-screen bg-gray-50 p-4 md:p-8">

              <div className="flex justify-between items-center mb-6">
                <div>
                  <h2 className="text-2xl md:text-3xl font-bold text-gray-800">Editar Participante</h2>
                  <p className="text-sm text-gray-500 mt-1">ID: {participanteEditando}</p>
                </div>
                <BotonVolver />
              </div>
              
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Nombre Completo *</label>
                  <input
                    type="text"
                    value={datosEditando.nombre}
                    onChange={(e) => setDatosEditando({...datosEditando, nombre: e.target.value})}
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Número de Documento *</label>
                  <input
                    type="text"
                    value={datosEditando.documento}
                    onChange={(e) => setDatosEditando({...datosEditando, documento: e.target.value})}
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Dirección</label>
                  <input
                    type="text"
                    value={datosEditando.direccion}
                    onChange={(e) => setDatosEditando({...datosEditando, direccion: e.target.value})}
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Teléfono</label>
                  <input
                    type="text"
                    value={datosEditando.telefono}
                    onChange={(e) => setDatosEditando({...datosEditando, telefono: e.target.value})}
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
              </div>

              <div className="mt-6 p-4 bg-yellow-50 border-l-4 border-yellow-500 rounded">
                <p className="text-sm text-yellow-800">
                  <strong>📝 Nota:</strong> Los ahorros y préstamos de este participante NO se verán afectados.
                </p>
              </div>

              <div className="mt-8 flex flex-col sm:flex-row gap-4">
                <button

            </div>
          </div>
        </div>

    const [vista, setVista] = useState('lista');
    const [mesCalculo, setMesCalculo] = useState(mesesPeriodo[mesesPeriodo.length - 1]);
    const [filtroParticipante, setFiltroParticipante] = useState(null);
    const [modoUnificar, setModoUnificar] = useState(false);
    const [prestamosSeleccionados, setPrestamosSeleccionados] = useState([]);
    const [nuevoPrestamo, setNuevoPrestamo] = useState({
      participanteId: '',
      monto: '',
      mesOtorgamiento: mesesPeriodo[0]
    });
    const [prestamoEditando, setPrestamoEditando] = useState(null);
    const [datosEditando, setDatosEditando] = useState({
      participanteId: '',
      monto: '',
      mesOtorgamiento: ''
    });

    const agregarPrestamo = () => {
      if (!nuevoPrestamo.participanteId || !nuevoPrestamo.monto) {
        alert('❌ Todos los campos son obligatorios');
        return;
      }

      const monto = parseFloat(nuevoPrestamo.monto);
      
      // Validar cupo del participante
      const cupo = calcularCupoParticipante(nuevoPrestamo.participanteId, nuevoPrestamo.mesOtorgamiento);
      if (monto > cupo) {
        const continuar = window.confirm(
          `⚠️ ADVERTENCIA: El préstamo (${formatearMoneda(monto)}) excede el cupo disponible del participante (${formatearMoneda(cupo)}).\n\n` +
          `Cupo = Ahorro + Utilidad + Sobre-utilidad - Deuda actual\n\n` +
          `¿Deseas continuar de todas formas?`
        );
        if (!continuar) return;
      }
      
      // Validar disponible total del sistema
      const disponible = calcularDisponibleTotal(nuevoPrestamo.mesOtorgamiento);
      if (monto > disponible) {
        alert(
          `❌ ERROR: El préstamo (${formatearMoneda(monto)}) excede el disponible total del sistema (${formatearMoneda(disponible)}).\n\n` +
          `No hay suficientes fondos. El préstamo NO puede ser otorgado.`
        );
        return;
      }

      const consecutivo = String(consecutivoPrestamo).padStart(3, '0');
      const nuevo = {
        consecutivo,
        participanteId: nuevoPrestamo.participanteId,
        monto: monto,
        mesOtorgamiento: nuevoPrestamo.mesOtorgamiento,
        estado: 'Activo',
        pagosRealizados: [],
        fechaCreacion: new Date().toISOString()
      };

      setPrestamos({...prestamos, [consecutivo]: nuevo});
      setConsecutivoPrestamo(consecutivoPrestamo + 1);
      setNuevoPrestamo({ participanteId: '', monto: '', mesOtorgamiento: mesesPeriodo[0] });
      setVista('lista');
      alert('✓ Préstamo registrado exitosamente');
    };

    const iniciarEdicion = (prestamo) => {
      setPrestamoEditando(prestamo.consecutivo);
      setDatosEditando({
        participanteId: prestamo.participanteId,
        monto: prestamo.monto,
        mesOtorgamiento: prestamo.mesOtorgamiento
      });
      setVista('editar');
    };

    const guardarEdicion = () => {
      if (!datosEditando.participanteId || !datosEditando.monto) {
        alert('❌ Todos los campos son obligatorios');
        return;
      }

      const monto = parseFloat(datosEditando.monto);
      const prestamoOriginal = prestamos[prestamoEditando];
      
      // Advertencia sobre recálculos
      const continuar = window.confirm(
        '⚠️ ADVERTENCIA: Editar este préstamo recalculará los intereses y el saldo.\n\n' +
        'Los pagos realizados se mantendrán, pero el saldo podría cambiar.\n\n' +
        '¿Deseas continuar?'
      );
      
      if (!continuar) return;

      const actualizado = {
        ...prestamoOriginal,
        participanteId: datosEditando.participanteId,
        monto: monto,
        mesOtorgamiento: datosEditando.mesOtorgamiento,
        fechaModificacion: new Date().toISOString()
      };

      setPrestamos({
        ...prestamos,
        [prestamoEditando]: actualizado
      });

      setPrestamoEditando(null);
      setDatosEditando({ participanteId: '', monto: '', mesOtorgamiento: '' });
      setVista('lista');
      alert('✓ Préstamo actualizado exitosamente');
    };

    const cancelarEdicion = () => {
      setPrestamoEditando(null);
      setDatosEditando({ participanteId: '', monto: '', mesOtorgamiento: '' });
      setVista('lista');
    };


    const toggleSeleccionPrestamo = (prestamoId) => {
      if (prestamosSeleccionados.includes(prestamoId)) {
        setPrestamosSeleccionados(prestamosSeleccionados.filter(id => id !== prestamoId));
      } else {
        setPrestamosSeleccionados([...prestamosSeleccionados, prestamoId]);
      }
    };

    const unificarPrestamos = () => {
      if (prestamosSeleccionados.length < 2) {
        alert('❌ Debes seleccionar al menos 2 préstamos para unificar');
        return;
      }

      // Verificar que todos sean del mismo participante
      const prestamosAUnificar = prestamosSeleccionados.map(id => prestamos[id]);
      const participanteId = prestamosAUnificar[0].participanteId;
      
      if (!prestamosAUnificar.every(p => p.participanteId === participanteId)) {
        alert('❌ Todos los préstamos deben ser del mismo participante');
        return;
      }

      // Calcular totales
      let montoTotal = 0;
      let saldoTotal = 0;
      let interesesTotal = 0;
      
      prestamosAUnificar.forEach(prestamo => {
        const estado = calcularEstadoPrestamo(prestamo, mesCalculo);
        montoTotal += prestamo.monto;
        saldoTotal += estado.saldo;
        interesesTotal += estado.interesesAcumulados;

      const participante = participantes[participanteId];
      const mensaje = 
        `🔗 UNIFICAR PRÉSTAMOS\n\n` +
        `Participante: ${participante.nombre}\n` +
        `Préstamos seleccionados: ${prestamosSeleccionados.length}\n\n` +
        `📊 RESUMEN:\n` +
        `Monto original total: ${formatearMoneda(montoTotal)}\n` +
        `Saldo total actual: ${formatearMoneda(saldoTotal)}\n` +
        `Intereses acumulados: ${formatearMoneda(interesesTotal)}\n\n` +
        `Se creará un NUEVO préstamo con el saldo total y los préstamos originales quedarán marcados como "Unificados".\n\n` +
        `¿Deseas continuar?`;

      if (!window.confirm(mensaje)) return;

      // Crear nuevo préstamo unificado
      const consecutivo = String(consecutivoPrestamo).padStart(3, '0');
      const nuevoUnificado = {
        consecutivo,
        participanteId,
        monto: saldoTotal, // El nuevo monto es el saldo total
        mesOtorgamiento: mesCalculo,
        estado: 'Activo',
        pagosRealizados: [],
        fechaCreacion: new Date().toISOString(),
        esUnificacion: true,
        prestamosUnificados: prestamosSeleccionados.map(id => ({
          id,
          montoOriginal: prestamos[id].monto,
          saldo: calcularEstadoPrestamo(prestamos[id], mesCalculo).saldo
        }))
      };

      // Marcar préstamos originales como unificados
      const prestamosActualizados = {...prestamos};
      prestamosSeleccionados.forEach(id => {
        prestamosActualizados[id] = {
          ...prestamosActualizados[id],
          estado: 'Unificado',
          prestamoUnificadoEn: consecutivo,
          fechaUnificacion: new Date().toISOString()
        };
      });

      // Agregar nuevo préstamo
      prestamosActualizados[consecutivo] = nuevoUnificado;

      setPrestamos(prestamosActualizados);
      setConsecutivoPrestamo(consecutivoPrestamo + 1);
      setPrestamosSeleccionados([]);
      setModoUnificar(false);
      
      alert(`✓ Préstamos unificados exitosamente. Nuevo préstamo: ${consecutivo}`);
    };

    const cancelarUnificacion = () => {
      setPrestamosSeleccionados([]);
      setModoUnificar(false);
    };

    if (vista === 'agregar') {
      return (

                    {(() => {

                      const ahorro = calcularAhorroHastaMes(nuevoPrestamo.participanteId, nuevoPrestamo.mesOtorgamiento);

  const Seccion5 = () => {
    const [mesSeleccionado, setMesSeleccionado] = useState(mesesPeriodo[0]);
    const [pagos, setPagos] = useState({});

    useEffect(() => {
      const inicial = {};
      Object.values(prestamos).forEach(prestamo => {
        if (prestamo.estado === 'Activo') {
          const pagoExistente = prestamo.pagosRealizados?.find(p => p.mes === mesSeleccionado);
          inicial[prestamo.consecutivo] = {
            abonoCapital: pagoExistente?.abonoCapital || '',
            interesesPagados: pagoExistente?.interesesPagados || '',
            pagaCon: pagoExistente?.pagaCon || '',
            cambioEntregado: pagoExistente?.cambioEntregado || false
          };
        }
      });
      setPagos(inicial);
    }, [mesSeleccionado, prestamos]);

    const registrarPagos = () => {
      const actualizados = {...prestamos};
      let totalRegistrado = 0;
      let prestamosLiquidados = 0;

      Object.keys(pagos).forEach(prestamoId => {
        const pago = pagos[prestamoId];
        const prestamo = actualizados[prestamoId];
        if (!prestamo) return;

        const abonoCapital = parseFloat(pago.abonoCapital || 0);
        const interesesPagados = parseFloat(pago.interesesPagados || 0);
        const pagaCon = parseFloat(pago.pagaCon || 0);
        const cambioEntregado = pago.cambioEntregado || false;

        if (abonoCapital === 0 && interesesPagados === 0) return;

        const pagosRealizados = prestamo.pagosRealizados || [];
        const indexPagoExistente = pagosRealizados.findIndex(p => p.mes === mesSeleccionado);

        const totalPagado = abonoCapital + interesesPagados;
        const cambioCalculado = pagaCon - totalPagado;

        const nuevoPago = {
          mes: mesSeleccionado,
          abonoCapital,
          interesesPagados,
          totalPagado,
          pagaCon,
          cambio: cambioCalculado,
          cambioEntregado,
          fecha: new Date().toISOString()
        };

        if (indexPagoExistente >= 0) {
          pagosRealizados[indexPagoExistente] = nuevoPago;
        } else {
          pagosRealizados.push(nuevoPago);
        }

        // Crear préstamo temporal con los pagos actualizados
        const prestamoTemporal = {
          ...prestamo,
          pagosRealizados
        };

        // Calcular el estado actual del préstamo después de este pago
        const estadoDespuesPago = calcularEstadoPrestamo(prestamoTemporal, mesSeleccionado);
        
        // Si el saldo es 0 o negativo, marcar como Liquidado
        let nuevoEstado = prestamo.estado;
        if (estadoDespuesPago.saldo <= 0.01) { // Tolerancia de 1 centavo por redondeos
          nuevoEstado = 'Liquidado';
          prestamosLiquidados++;
        }

        actualizados[prestamoId] = {
          ...prestamo,
          pagosRealizados,
          estado: nuevoEstado,
          fechaLiquidacion: nuevoEstado === 'Liquidado' ? new Date().toISOString() : prestamo.fechaLiquidacion
        };

        totalRegistrado++;
      });

      setPrestamos(actualizados);
      setPagos({}); // Limpiar el formulario
      
      let mensaje = `✓ Pagos registrados/actualizados para ${totalRegistrado} préstamo(s)`;
      if (prestamosLiquidados > 0) {
        mensaje += `\n\n🎉 ¡${prestamosLiquidados} préstamo(s) LIQUIDADO(S) completamente!`;
        mensaje += '\n\nEstos préstamos ya NO aparecerán en Recaudos.';
      }
      alert(mensaje);
    };

    const prestamosActivos = Object.values(prestamos).filter(p => p.estado === 'Activo');

    return (
      <div className="min-h-screen bg-gray-50 p-4 md:p-8">
        <div className="max-w-7xl mx-auto">
          <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
              <div>
                <h2 className="text-2xl md:text-3xl font-bold text-gray-800">Recaudos Mensuales</h2>

                      {/* FILA DE TOTALES */}
                      {prestamosActivos.length > 0 && (() => {

      let texto = `INFORME INDIVIDUAL - ${p.nombre}\n`;

      texto += `Período: ${nombreMes(config.periodoInicio)} a ${nombreMes(mesSeleccionado)}\n`;
      texto += `Fecha de generación: ${new Date().toLocaleString('es-CO')}\n\n`;
      texto += `===========================================\n\n`;

      texto += `HISTORIAL MES A MES:\n\n`;

      mesesPeriodo.forEach(mes => {
        if (mes <= mesSeleccionado) {
          const ahorro = p.ahorrosMensuales?.find(a => a.mes === mes)?.cantidad || 0;
          const ahorroAcum = calcularAhorroHastaMes(p.consecutivo, mes);
          
          texto += `${nombreMes(mes)}:\n`;
          texto += `  Ahorro del mes: ${formatearMoneda(ahorro)}\n`;
          texto += `  Ahorro acumulado: ${formatearMoneda(ahorroAcum)}\n`;
          
          if (tipoUtilidad === 'tradicional' || tipoUtilidad === 'ambas') {
            const utilTrad = calcularUtilidadTradicionalMes(p.consecutivo, mes);
            const utilTradAcum = calcularUtilidadTradicionalAcumulada(p.consecutivo, mes);
            const sobreUtilTrad = calcularSobreUtilidadTradicionalMes(p.consecutivo, mes);
            const sobreUtilTradAcum = calcularSobreUtilidadTradicionalAcumulada(p.consecutivo, mes);
            
            texto += `  Utilidad Tradicional (mes): ${formatearMoneda(utilTrad)}\n`;
            texto += `  Utilidad Tradicional (acum): ${formatearMoneda(utilTradAcum)}\n`;
            texto += `  Sobre-utilidad Tradicional (mes): ${formatearMoneda(sobreUtilTrad)}\n`;
            texto += `  Sobre-utilidad Tradicional (acum): ${formatearMoneda(sobreUtilTradAcum)}\n`;
          }
          
          if (tipoUtilidad === 'productividad' || tipoUtilidad === 'ambas') {
            const utilProd = calcularUtilidadProductividadMes(p.consecutivo, mes);
            const utilProdAcum = calcularUtilidadProductividadAcumulada(p.consecutivo, mes);
            const sobreUtilProd = calcularSobreUtilidadProductividadMes(p.consecutivo, mes);
            const sobreUtilProdAcum = calcularSobreUtilidadProductividadAcumulada(p.consecutivo, mes);
            
            texto += `  Utilidad Productividad (mes): ${formatearMoneda(utilProd)}\n`;
            texto += `  Utilidad Productividad (acum): ${formatearMoneda(utilProdAcum)}\n`;
            texto += `  Sobre-utilidad Productividad (mes): ${formatearMoneda(sobreUtilProd)}\n`;
            texto += `  Sobre-utilidad Productividad (acum): ${formatearMoneda(sobreUtilProdAcum)}\n`;
          }
          
          texto += `\n`;
        }
      });

      if (prestamosParticipante.length > 0) {

      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 500000) {
        alert('⚠️ La imagen es muy grande. Máximo 500KB.');
        return;
      }

      const reader = new FileReader();
      reader.onload = async (evento) => {
        const nuevasFirmas = {
          ...firmasDigitales,
          [participanteId]: {
            firma: evento.target.result,
            fecha: new Date().toISOString()
          }
        };
        setFirmasDigitales(nuevasFirmas);
        try {
          await window.storage.set('firmas-digitales', JSON.stringify(nuevasFirmas));
          alert('✓ Firma digital guardada');
        } catch (err) {
          alert('❌ Error al guardar firma: ' + err.message);
        }

      reader.readAsDataURL(file);
